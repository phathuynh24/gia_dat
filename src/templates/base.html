<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard giá nhà Bình Thạnh{% endblock %}</title>
  <script src="{{ url_for('static', filename='chart.umd.min.js') }}"></script>
  <style>
    :root {
      --bg: #f5f6f8; --card: #fff; --ink: #1a2027; --muted: #6b7785;
      --line: #e4e7ec; --accent: #1f6feb; --accent2: #16a34a; --warn: #d97706;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--ink); }
    header { background: var(--card); border-bottom: 1px solid var(--line);
             padding: 14px 24px; display: flex; align-items: center; gap: 24px; }
    header h1 { font-size: 17px; margin: 0; }
    nav a { color: var(--muted); text-decoration: none; font-weight: 600;
            font-size: 14px; margin-right: 18px; }
    nav a.active, nav a:hover { color: var(--accent); }
    .wrap { max-width: 1100px; margin: 22px auto; padding: 0 24px; }
    .card { background: var(--card); border: 1px solid var(--line);
            border-radius: 12px; padding: 18px 20px; margin-bottom: 20px; }
    .card h2 { font-size: 15px; margin: 0 0 14px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    select, input { width: 100%; padding: 8px 10px; border: 1px solid var(--line);
                    border-radius: 8px; font-size: 14px; background: #fff; }
    .filters { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; align-items: end; }
    @media (max-width: 820px) { .filters { grid-template-columns: 1fr 1fr; } }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
             padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
    a.btn-clear { font-size: 13px; color: var(--muted); text-decoration: none; align-self: center; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    tr:hover td { background: #fafbfc; }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .tag-mt { background: #e0edff; color: #1f6feb; }
    .tag-hxh { background: #dcfce7; color: #16a34a; }
    .tag-hem { background: #f1f5f9; color: #64748b; }
    .tag-real { background: #fef3c7; color: #b45309; }
    .banner-demo { background: #fef3c7; border: 1px solid #fde68a; color: #92400e;
                   border-radius: 10px; padding: 11px 16px; margin-bottom: 18px; font-size: 13px; }
    .banner-demo code { background: #fffbeb; padding: 1px 6px; border-radius: 5px; font-size: 12px; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
    @media (max-width: 820px) { .kpis { grid-template-columns: 1fr 1fr; } }
    .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
    .kpi .v { font-size: 28px; font-weight: 700; }
    .kpi .v .u { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 3px; }
    .kpi .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .stat-row { display: flex; gap: 28px; }
    .stat .v { font-size: 26px; font-weight: 700; }
    .stat .v.p50 { color: var(--accent2); }
    .stat .l { font-size: 12px; color: var(--muted); }
    .muted { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>🏠 Giá nhà Bình Thạnh</h1>
    <nav>
      <a href="/" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a>
      <a href="/dinh-gia" class="{% if request.path == '/dinh-gia' %}active{% endif %}">Định giá nhanh</a>
    </nav>
  </header>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
